<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForgeFlow offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070a;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.20), transparent 34%),
          #05070a;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.88);
        padding: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 12px 0 0;
        color: #94a3b8;
        line-height: 1.6;
      }

      button {
        margin-top: 22px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 18px;
        background: #0ea5e9;
        color: white;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>O ForgeFlow não conseguiu carregar os dados agora. Verifique a conexão e tente novamente.</p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
