<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>ForgeFlow offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0b0f;
        color: #fafafa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.24), transparent 36%),
          radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.18), transparent 32%),
          #0b0b0f;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(24, 24, 27, 0.9);
        border-radius: 32px;
        padding: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 26px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.05;
      }

      p {
        margin: 12px 0 0;
        color: #a1a1aa;
        line-height: 1.6;
      }

      button {
        margin-top: 22px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 18px;
        background: #8b5cf6;
        color: white;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">FF</div>
      <h1>Você está offline</h1>
      <p>
        O ForgeFlow não conseguiu carregar a página agora. Verifique sua conexão e tente novamente.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
